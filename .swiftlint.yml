# Use SwiftLint's default rules; only limit the source directories.
included:
  - Buffet
  - BuffetTests

custom_rules:
  domain_framework_dependency:
    included: "Buffet/Domain/.*\\.swift"
    name: "Domain Framework Dependency"
    regex: "(?m)^import (SwiftUI|UIKit|Moya|Kingfisher)$"
    message: "Domain must not import UI or data frameworks."
    severity: error
  data_ui_dependency:
    included: "Buffet/Data/.*\\.swift"
    name: "Data UI Dependency"
    regex: "(?m)^import (SwiftUI|UIKit)$"
    message: "Data must not import UI frameworks."
    severity: error
  presentation_infrastructure_dependency:
    included: "Buffet/Presentation/.*\\.swift"
    excluded: "Buffet/Presentation/Shared/Components/RemoteImage.swift"
    name: "Presentation Infrastructure Dependency"
    regex: "(?m)^import (Kingfisher|Moya)$"
    message: "Presentation reaches infrastructure through an adapter; only RemoteImage may import the image library."
    severity: error
